<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Car Store</title>

    <!-- ربط CSS -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-card">
    <h2> CarZone</h2>

    <form id="carForm">
        <input type="password" id="password" placeholder="enter password" required>

        <div class="radio-group">
            <label><input type="radio" name="contactType" value="email" checked> Email</label>
            <label><input type="radio" name="contactType" value="phone"> Phone</label>
        </div>

        <input type="text" id="userContact" placeholder="Email or Phone Number" required>

        <button type="submit">SIGN UP</button>
    </form>

    <p id="status-msg"></p>
</div>

<img src="car.png" id="car-sprite">

<!-- ربط JS -->
<script src="login (1).js"></script>

</body>
</html>
